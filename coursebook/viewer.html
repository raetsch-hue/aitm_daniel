<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursebook – Viewer</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1b19; --muted:#6b6862; --line:#e3e0da;
    --card:#ffffff; --accent:#7a5cff; --accent-soft:#f0ecff; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161a; --fg:#eceaf0; --muted:#a09daa; --line:#302e38;
      --card:#1f1e24; --accent:#a897ff; --accent-soft:#282342; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  header h1{font-size:15px; font-weight:600; margin:0; letter-spacing:-.01em}
  header .spacer{flex:1}
  #nav{
    max-width:min(46vw,420px); padding:7px 30px 7px 11px; border:1px solid var(--line);
    border-radius:7px; background:var(--card); color:var(--fg); font:inherit; font-size:14px;
    cursor:pointer; appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                     linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%, calc(100% - 11px) 52%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  #nav:hover{border-color:var(--accent)}
  #nav:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  #nav[hidden]{display:none}
  #q{
    width:260px; max-width:45vw; padding:7px 11px; border:1px solid var(--line);
    border-radius:7px; background:var(--card); color:var(--fg); font-size:14px;
  }
  #q:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  .btn{
    padding:7px 13px; border:1px solid var(--line); border-radius:7px;
    background:var(--card); color:var(--fg); font-size:14px; cursor:pointer;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  #suche{display:flex; gap:6px; align-items:center}
  .btn.step{padding:6px 10px; line-height:1; font-size:16px}
  .btn.step[disabled]{opacity:.35; cursor:default}
  .btn.step[disabled]:hover{border-color:var(--line); color:var(--fg)}
  mark{background:var(--accent-soft); color:inherit; border-radius:3px; padding:0 1px;
       scroll-margin-top:96px}
  mark.aktiv{background:var(--accent); color:var(--bg)}
  #count{font-size:13px; color:var(--muted); white-space:nowrap}
  main{max-width:1080px; margin:0 auto; padding:32px 24px 40px}
  #drop{
    border:2px dashed var(--line); border-radius:12px; padding:56px 24px;
    text-align:center; color:var(--muted); background:var(--card);
  }
  #drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--fg)}
  #drop strong{display:block; color:var(--fg); font-size:17px; margin-bottom:8px}
  #drop code{background:var(--bg); padding:2px 6px; border-radius:4px; font-size:13px}
  article h1{font-size:30px; letter-spacing:-.02em; margin:0 0 6px}
  article h2{
    font-size:20px; margin:44px 0 14px; padding-top:20px;
    border-top:1px solid var(--line); letter-spacing:-.01em;
  }
  article h3{font-size:16px; margin:28px 0 10px}
  article p{margin:12px 0}
  article a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent}
  article a:hover{border-bottom-color:var(--accent)}
  article blockquote{
    margin:24px 0; padding:14px 18px; border-left:3px solid var(--accent);
    background:var(--card); border-radius:0 8px 8px 0; color:var(--muted);
  }
  article blockquote p{margin:0}
  article ul,article ol{padding-left:22px}
  article li{margin:6px 0}
  article code{background:var(--card); padding:2px 6px; border-radius:4px; font-size:13.5px}
  article pre{background:var(--card); border:1px solid var(--line); border-radius:9px;
              padding:14px 16px; overflow-x:auto}
  article pre code{background:none; padding:0; font-size:13px}
  .tablewrap{overflow-x:auto; margin:18px 0; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
  table{border-collapse:collapse; width:100%; background:var(--card); font-size:14.5px}
  th,td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
  th{
    background:var(--bg); font-weight:600; font-size:12.5px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--muted); position:sticky; top:59px;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--accent-soft)}
  tr.hidden{display:none}
  .err{padding:18px; border:1px solid #d4574c; border-radius:10px; background:var(--card); color:#d4574c; text-align:left}
  .err code{background:var(--bg); padding:2px 6px; border-radius:4px; font-size:13px}

  /* --- Dateiliste unten --- */
  #files{
    border-top:1px solid var(--line); background:var(--card);
    padding:22px 24px 40px; margin-top:48px;
  }
  #files .inner{max-width:1080px; margin:0 auto}
  #files .head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  #build{font-size:11px; color:var(--muted); border:1px solid var(--line);
         border-radius:5px; padding:1px 7px; white-space:nowrap}
  #files h2{font-size:13px; font-weight:600; margin:0; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  #files .spacer{flex:1}
  #filehint{font-size:13.5px; color:var(--muted); margin:0 0 14px}
  #filehint code{background:var(--bg); padding:2px 6px; border-radius:4px; font-size:12.5px}
  #filelist{list-style:none; margin:0; padding:0; display:grid; gap:8px;
            grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  #filelist button{
    width:100%; text-align:left; cursor:pointer; font:inherit; font-size:14px;
    background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:9px; padding:10px 13px; display:flex; gap:10px; align-items:baseline;
  }
  #filelist button:hover{border-color:var(--accent)}
  #filelist button.active{border-color:var(--accent); background:var(--accent-soft)}
  #filelist .nm{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #filelist .sz{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap}
  #filelist .pt{display:block; font-size:12px; color:var(--muted); margin-top:2px;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
</style>
</head>
<body>

<header>
  <h1 id="title">Coursebook</h1>
  <select id="nav" aria-label="Dokument wählen" title="Dokument wählen"></select>
  <span class="spacer"></span>
  <span id="suche" hidden>
    <input id="q" type="search" placeholder="Im Dokument suchen …" autocomplete="off">
    <button class="btn step" id="prev" title="Vorheriger Treffer (Umschalt+Enter)" aria-label="Vorheriger Treffer">&#8249;</button>
    <button class="btn step" id="next" title="Nächster Treffer (Enter)" aria-label="Nächster Treffer">&#8250;</button>
  </span>
  <span id="count"></span>
  <button class="btn" id="pick">Datei …</button>
  <input type="file" id="file" accept=".md,.markdown,text/markdown" hidden>
</header>

<main>
  <div id="drop">
    <strong>Dokument unten auswählen</strong>
    Die verfügbaren Dateien stehen am Seitenende.<br>
    Beim Öffnen per Doppelklick (<code>file://</code>) darf der Browser sie nicht selbst lesen —
    zieh dann den Ordner <code>coursebook</code> in dieses Fenster.
  </div>
  <article id="out" hidden></article>
</main>

<section id="files">
  <div class="inner">
    <div class="head">
      <h2>Dokumente</h2>
      <span id="build" title="Stand dieser viewer.html"></span>
      <span class="spacer"></span>
      <button class="btn" id="pickdir">Ordner einlesen …</button>
      <input type="file" id="dir" webkitdirectory directory multiple hidden>
    </div>
    <p id="filehint">Wird geladen …</p>
    <ul id="filelist"></ul>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<!-- Dokumentliste. Als <script> eingebunden, weil das auch bei file:// funktioniert,
     wo fetch() gesperrt ist. Gepflegt wird ausschliesslich dateien.js. -->
<script src="dateien.js"></script>
<script>
(function(){
  var out=document.getElementById('out'), drop=document.getElementById('drop'),
      q=document.getElementById('q'), count=document.getElementById('count'),
      file=document.getElementById('file'), dir=document.getElementById('dir'),
      filelist=document.getElementById('filelist'),
      filehint=document.getElementById('filehint'),
      nav=document.getElementById('nav'),
      suche=document.getElementById('suche'),
      prevBtn=document.getElementById('prev'),
      nextBtn=document.getElementById('next');

  var rohHTML='';          // gerendertes Dokument ohne Trefferauszeichnung
  var SPEICHER='coursebook.zuletzt';

  // Der Merker liegt nur in diesem Browser. Ist er gesperrt (privates Fenster,
  // blockierte Website-Daten), faellt alles still auf den ersten Eintrag zurueck.
  function merken(pfad){ try{ localStorage.setItem(SPEICHER, pfad); }catch(e){} }
  function gemerkt(){ try{ return localStorage.getItem(SPEICHER); }catch(e){ return null; } }
  var treffer=[], aktiv=-1;

  var found=[];        // {name, path, size, local, get:()=>Promise<string>}
  var activePath=null;
  var isFile = (location.protocol === 'file:');

  function isMd(n){ return /\.(md|markdown|mdown|mkd)$/i.test(n); }
  function base(p){ return String(p).replace(/^.*[\/\\]/,''); }
  function kb(b){ return b<1024 ? b+' B' : (b/1024).toFixed(1).replace('.',',')+' kB'; }

  function fail(html){
    drop.hidden=false; out.hidden=true; suche.hidden=true; count.textContent='';
    drop.innerHTML='<div class="err">'+html+'</div>';
  }

  function render(md, label, path){
    if(typeof marked==='undefined'){
      fail('Der Markdown-Renderer konnte nicht geladen werden (keine Internetverbindung?). '+
           'Die Seite braucht cdnjs.cloudflare.com beim ersten Laden.');
      return;
    }
    out.innerHTML=marked.parse(md);
    out.querySelectorAll('table').forEach(function(t){
      var w=document.createElement('div'); w.className='tablewrap';
      t.parentNode.insertBefore(w,t); w.appendChild(t);
    });
    out.querySelectorAll('a').forEach(function(a){
      if(/^https?:/.test(a.getAttribute('href')||'')){ a.target='_blank'; a.rel='noopener'; }
    });
    // Der Kopftitel bleibt die Marke; welches Dokument offen ist,
    // zeigt das Auswahlfeld daneben.
    if(label) document.title = label + ' – Coursebook';
    activePath = path || null;
    if(activePath) merken(activePath);
    drop.hidden=true; out.hidden=false; suche.hidden=false;
    rohHTML = out.innerHTML;          // Fassung ohne Trefferauszeichnung merken
    treffer=[]; aktiv=-1; q.value=''; count.textContent='';
    prevBtn.disabled = nextBtn.disabled = true;
    paintList();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ---------- Volltextsuche im offenen Dokument ---------- */

  function zaehlerZeigen(){
    if(!treffer.length){
      count.textContent = q.value.trim() ? 'kein Treffer' : '';
    } else {
      count.textContent = (aktiv+1) + ' / ' + treffer.length;
    }
    prevBtn.disabled = nextBtn.disabled = treffer.length < 2;
  }

  function suchen(){
    var term = q.value.trim();
    if(rohHTML) out.innerHTML = rohHTML;   // frühere Markierungen entfernen
    treffer = []; aktiv = -1;
    if(term.length < 2){ zaehlerZeigen(); return; }

    var lower = term.toLowerCase();
    var walker = document.createTreeWalker(out, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
        var el = n.parentNode;
        if(el && (el.nodeName==='SCRIPT' || el.nodeName==='STYLE')) return NodeFilter.FILTER_REJECT;
        return n.nodeValue.toLowerCase().indexOf(lower) > -1
             ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var knoten = [], n;
    while((n = walker.nextNode())) knoten.push(n);

    knoten.forEach(function(tn){
      var text = tn.nodeValue, low = text.toLowerCase();
      var frag = document.createDocumentFragment(), i = 0, j;
      while((j = low.indexOf(lower, i)) > -1){
        if(j > i) frag.appendChild(document.createTextNode(text.slice(i, j)));
        var m = document.createElement('mark');
        m.textContent = text.slice(j, j + term.length);
        frag.appendChild(m); treffer.push(m);
        i = j + term.length;
      }
      if(i < text.length) frag.appendChild(document.createTextNode(text.slice(i)));
      tn.parentNode.replaceChild(frag, tn);
    });

    if(treffer.length) springe(0, true);
    else zaehlerZeigen();
  }

  // Zu einem Treffer springen. absolut=true: Index direkt, sonst Schrittweite.
  function springe(wert, absolut){
    if(!treffer.length) return;
    if(aktiv > -1 && treffer[aktiv]) treffer[aktiv].classList.remove('aktiv');
    aktiv = absolut ? wert : (aktiv + wert + treffer.length) % treffer.length;
    var m = treffer[aktiv];
    m.classList.add('aktiv');
    m.scrollIntoView({block:'center', behavior:'smooth'});
    zaehlerZeigen();
  }

  var tippTimer;
  q.addEventListener('input', function(){
    clearTimeout(tippTimer);
    tippTimer = setTimeout(suchen, 160);
  });
  q.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); springe(e.shiftKey ? -1 : 1); }
    if(e.key === 'Escape'){ q.value=''; suchen(); q.blur(); }
  });
  prevBtn.addEventListener('click', function(){ springe(-1); q.focus(); });
  nextBtn.addEventListener('click', function(){ springe(1); q.focus(); });

  // Strg/Cmd+F fängt die Suche im Dokument ab, solange eines offen ist
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='f' && !suche.hidden){
      e.preventDefault(); q.focus(); q.select();
    }
  });

  /* ---------- Einträge ---------- */

  // Manifest-Eintrag: wird über das Netz nachgeladen (http/https).
  function remote(path, label){
    return {name: label||base(path), path:path, size:0, local:false,
      get:function(){
        return fetch(path,{cache:'no-store'}).then(function(r){
          if(!r.ok) throw new Error('HTTP '+r.status);
          return r.text();
        });
      }};
  }

  // Lokal gewählte oder hereingezogene Datei.
  function local(f, path){
    return {name:f.name, path:path||f.webkitRelativePath||f.name, size:f.size, local:true,
            get:function(){ return f.text(); }};
  }

  // Lokale Datei ersetzt den Manifest-Eintrag mit gleichem Dateinamen,
  // damit die Liste nicht doppelt wird und der Titel erhalten bleibt.
  function merge(entry){
    for(var i=0;i<found.length;i++){
      if(base(found[i].path).toLowerCase() === base(entry.path).toLowerCase()){
        if(entry.local && !found[i].local){
          entry.name = found[i].name;   // Titel aus dem Manifest behalten
          entry.path = found[i].path;
          found[i] = entry;
        }
        return found[i];
      }
    }
    found.push(entry);
    return entry;
  }

  // Nummer aus dem Pfad ("1.4/..." -> [1,4]), ersatzweise aus dem Titel ("1.4 · ...").
  function nummer(f){
    var m = /(\d+(?:\.\d+)*)/.exec(f.path.split('/')[0]) || /(\d+(?:\.\d+)*)/.exec(f.name);
    return m ? m[1].split('.').map(Number) : null;
  }

  // Aufsteigend nach Nummer: 1.4 < 1.5 < 1.10 < 2.1. Ohne Nummer ans Ende.
  function sortiere(){
    found.sort(function(a,b){
      var A=nummer(a), B=nummer(b);
      if(A && B){
        for(var i=0, n=Math.max(A.length,B.length); i<n; i++){
          var x=A[i]||0, y=B[i]||0;
          if(x!==y) return x-y;
        }
        return a.name.localeCompare(b.name,'de');
      }
      if(A) return -1;
      if(B) return 1;
      return a.name.localeCompare(b.name,'de');
    });
  }

  function loadManifest(list){
    found = [];
    (list||[]).forEach(function(it){
      if(!it) return;
      var p = (typeof it==='string') ? it : (it.datei || it.name);
      if(p) found.push(remote(p, (typeof it==='object' && it.titel) ? it.titel : base(p)));
    });
  }

  // Ueber http(s) pruefen, ob die gelisteten Dateien wirklich da sind.
  // Fehlende werden sofort sichtbar markiert, statt erst beim Klick zu scheitern.
  function pruefen(){
    if(isFile) return;
    found.forEach(function(f){
      if(f.local) return;
      fetch(f.path, {method:'HEAD', cache:'no-store'})
        .then(function(r){ if(!r.ok) f.fehlt=true; })
        .catch(function(){ f.fehlt=true; })
        .then(paintList);
    });
  }

  function openDoc(f, rueckfall){
    f.get().then(function(t){ render(t, f.name, f.path); }).catch(function(){
      // Beim Start: laesst sich das gemerkte Dokument nicht laden, nimm den ersten.
      if(rueckfall && rueckfall !== f){ openDoc(rueckfall); return; }
      if(isFile && !f.local){
        fail('<strong>'+f.name+'</strong> lässt sich per Doppelklick nicht laden — '+
             'der Browser sperrt lokale Dateizugriffe.<br><br>'+
             'Zieh den Ordner <code>coursebook</code> in dieses Fenster (dann sind alle '+
             'Dokumente lesbar), oder starte im Ordner kurz einen Server:<br>'+
             '<code>python -m http.server</code> und öffne '+
             '<code>http://localhost:8000/viewer.html</code>.');
      } else {
        fail('<strong>'+f.name+'</strong> gibt es nicht (mehr).<br><br>'+
             'Gesucht unter <code>'+f.path+'</code>. Entweder die Datei dorthin legen, '+
             'oder den Eintrag aus <code>dateien.js</code> entfernen.');
      }
    });
  }

  // Auswahlfeld im Kopf, gespeist aus derselben Liste wie unten
  function paintNav(){
    if(!found.length){ nav.hidden=true; nav.innerHTML=''; return; }
    nav.hidden=false;
    nav.innerHTML='';
    var ph=document.createElement('option');
    ph.value=''; ph.textContent='Dokument wählen …'; ph.disabled=true;
    if(!activePath) ph.selected=true;
    nav.appendChild(ph);
    found.forEach(function(f){
      var o=document.createElement('option');
      o.value=f.path;
      o.textContent=f.name + (f.fehlt ? '  (fehlt)' : (isFile && !f.local ? '  (gesperrt)' : ''));
      if(f.path===activePath) o.selected=true;
      nav.appendChild(o);
    });
  }

  nav.addEventListener('change', function(){
    var ziel=nav.value; if(!ziel) return;
    for(var i=0;i<found.length;i++){ if(found[i].path===ziel){ openDoc(found[i]); return; } }
  });

  function paintList(){
    sortiere();
    paintNav();
    filelist.innerHTML='';
    if(!found.length){
      filehint.innerHTML='Keine Dokumente eingetragen — in <code>dateien.js</code> ergänzen.';
      paintNav();
      return;
    }
    var n = found.length, lokal = found.filter(function(f){ return f.local; }).length;
    if(isFile && lokal < n){
      filehint.innerHTML = n+' Dokument'+(n===1?'':'e')+' gelistet'+
        (lokal ? ', '+lokal+' davon eingelesen. ' : '. ')+
        'Per Doppelklick geöffnet darf der Browser die übrigen nicht lesen — '+
        'zieh den Ordner <code>coursebook</code> hierher oder nutze „Ordner einlesen …".';
    } else {
      var weg = found.filter(function(f){ return f.fehlt; }).length;
      filehint.innerHTML = n+' Dokument'+(n===1?'':'e')+'.'+
        (weg ? ' <span style="color:#d4574c">'+weg+' davon nicht gefunden — Eintrag in '+
               '<code>dateien.js</code> entfernen oder Datei ergänzen.</span>' : '');
    }
    found.forEach(function(f){
      var li=document.createElement('li'), b=document.createElement('button');
      b.className = (f.path===activePath) ? 'active' : '';
      b.innerHTML = '<span><span class="nm"></span><span class="pt"></span></span>'+
                    '<span class="sz"></span>';
      b.querySelector('.nm').textContent=f.name;
      b.querySelector('.pt').textContent=f.path;
      var sz=b.querySelector('.sz');
      if(f.fehlt){ sz.textContent='fehlt'; sz.style.color='#d4574c'; b.style.opacity='.6'; }
      else if(f.size) sz.textContent=kb(f.size);
      else if(isFile && !f.local) sz.textContent='gesperrt';
      b.addEventListener('click', function(){ openDoc(f); });
      li.appendChild(b); filelist.appendChild(li);
    });
  }

  /* ---------- Einzeldatei ---------- */

  document.getElementById('pick').addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(){
    var f=file.files[0]; if(!f) return;
    var e=merge(local(f)); paintList(); openDoc(e);
  });

  /* ---------- Ordner einlesen ---------- */

  document.getElementById('pickdir').addEventListener('click', function(){ dir.click(); });
  dir.addEventListener('change', function(){
    var n=0;
    Array.prototype.slice.call(dir.files).forEach(function(f){
      if(isMd(f.name)){ merge(local(f, f.webkitRelativePath||f.name)); n++; }
    });
    paintList();
    if(!n){ filehint.textContent='In diesem Ordner wurden keine Markdown-Dateien gefunden.'; return; }
    if(!activePath){
      var erste = found.filter(function(f){ return f.local; })[0];
      if(erste) openDoc(erste);
    }
  });

  /* ---------- Drag & Drop: Datei oder Ordner ---------- */

  function walk(entry, prefix, depth){
    if(depth>4) return Promise.resolve();
    if(entry.isFile){
      if(!isMd(entry.name)) return Promise.resolve();
      return new Promise(function(res){
        entry.file(function(f){ merge(local(f, prefix+entry.name)); res(); }, res);
      });
    }
    if(entry.isDirectory){
      var rdr=entry.createReader(), all=[];
      return new Promise(function(res){
        (function read(){
          rdr.readEntries(function(batch){
            if(!batch.length){
              Promise.all(all.map(function(e){ return walk(e, prefix+entry.name+'/', depth+1); })).then(res);
              return;
            }
            all=all.concat(Array.prototype.slice.call(batch)); read();
          }, res);
        })();
      });
    }
    return Promise.resolve();
  }

  ['dragenter','dragover'].forEach(function(e){
    document.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(e){
    document.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove('over'); });
  });
  document.addEventListener('drop', function(ev){
    var dt=ev.dataTransfer; if(!dt) return;
    var items=dt.items ? Array.prototype.slice.call(dt.items) : [];
    var entries=items.map(function(i){ return i.webkitGetAsEntry && i.webkitGetAsEntry(); }).filter(Boolean);

    if(entries.length){
      Promise.all(entries.map(function(e){ return walk(e,'',0); })).then(function(){
        paintList();
        if(!activePath){
          var erste = found.filter(function(f){ return f.local; })[0];
          if(erste) openDoc(erste);
        }
      });
      return;
    }
    var f=dt.files && dt.files[0];
    if(f){ var e=merge(local(f)); paintList(); openDoc(e); }
  });

  /* ---------- Start ---------- */

  // Zuletzt gelesenes Dokument oeffnen; gibt es keins oder laesst es sich
  // nicht laden, den ersten Eintrag der Liste.
  function startDokument(){
    if(isFile || activePath || !found.length) return;
    var wunsch = gemerkt(), ziel = null;
    if(wunsch){
      for(var i=0;i<found.length;i++){ if(found[i].path===wunsch){ ziel=found[i]; break; } }
    }
    if(ziel && ziel !== found[0]) openDoc(ziel, found[0]);
    else openDoc(found[0]);
  }


  var BUILD = '2026-08-28g';
  document.getElementById('build').textContent = 'Viewer ' + BUILD;

  // 1. Liste aus dateien.js, das als <script> geladen wurde. Funktioniert
  //    ueberall, auch bei Doppelklick (file://), wo fetch gesperrt ist.
  if(typeof DOKUMENTE === 'undefined'){
    filehint.innerHTML = '<span style="color:#d4574c"><strong>dateien.js konnte nicht geladen werden.</strong> '+
      'Liegt die Datei neben viewer.html? Bei einem Syntaxfehler darin steht die Ursache '+
      'in der Browser-Konsole (F12).</span>';
  } else {
    loadManifest(DOKUMENTE);
    paintList();
    pruefen();
    startDokument();
  }

  // 2. Ueber http(s) dateien.js zusaetzlich ungecacht nachladen. Ohne das
  //    kann der Browser eine alte Fassung behalten, obwohl auf dem Server
  //    laengst eine neue liegt. Aendert sich nichts, passiert auch nichts.
  if(!isFile){
    fetch('dateien.js?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(txt){
        var frisch = new Function(txt + '; return typeof DOKUMENTE!=="undefined" ? DOKUMENTE : null;')();
        if(!frisch || !frisch.length) return;
        var alt = found.map(function(f){ return f.path; }).join('|');
        var neu = frisch.map(function(it){ return (typeof it==='string') ? it : (it.datei||it.name); }).join('|');
        if(alt === neu) return;                       // nichts geaendert
        loadManifest(frisch); paintList(); pruefen();
        startDokument();
      })
      .catch(function(){ /* egal: die Liste aus dem <script> steht bereits */ });
  }

})();
</script>
</body>
</html>
